<style>
/* Banner */
.banner {
    position: relative;
    background: linear-gradient(135deg, #FFD700, #FF69B4);
    color: #fff;
    border-radius: 25px;
    padding: 50px 20px;
    overflow: hidden;
    margin-bottom: 50px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    text-align: center;
}

/* Balloon style */
.balloon {
    position: absolute;
    width: 50px;
    height: 70px;
    border-radius: 50% 50% 50% 50%;
    background: radial-gradient(circle at 30% 30%, #ff4d4d, #ff1a1a);
    animation: float 8s infinite ease-in-out;
}

.balloon::after {
    content: '';
    position: absolute;
    bottom: -20px;
    left: 50%;
    width: 2px;
    height: 20px;
    background: #333;
}

/* Different balloon colors */
.balloon:nth-child(1) { background: radial-gradient(circle at 30% 30%, #ff4d4d, #ff1a1a); animation-delay: 0s; left: 10%; }
.balloon:nth-child(2) { background: radial-gradient(circle at 30% 30%, #4dff4d, #1aff1a); animation-delay: 2s; left: 30%; }
.balloon:nth-child(3) { background: radial-gradient(circle at 30% 30%, #4d4dff, #1a1aff); animation-delay: 4s; left: 50%; }
.balloon:nth-child(4) { background: radial-gradient(circle at 30% 30%, #ffff4d, #ffff1a); animation-delay: 6s; left: 70%; }

/* Balloon animation */
@keyframes float {
    0% { transform: translateY(100px) rotate(0deg); }
    50% { transform: translateY(-50px) rotate(10deg); }
    100% { transform: translateY(100px) rotate(-10deg); }
}

/* Cloud style */
.cloud {
    position: absolute;
    width: 120px;
    height: 60px;
    background: #fff;
    border-radius: 60px;
    opacity: 0.8;
    animation: cloudMove 20s linear infinite;
}

.cloud:nth-child(5) { top: 20px; left: -150px; animation-duration: 25s; }
.cloud:nth-child(6) { top: 60px; left: -200px; animation-duration: 30s; }
.cloud:nth-child(7) { top: 40px; left: -100px; animation-duration: 22s; }

@keyframes cloudMove {
    0% { transform: translateX(0); }
    100% { transform: translateX(120vw); }
}

h1.display-5, p.lead {
    z-index: 10;
    position: relative;
    color: #000;
}
</style>
</head>
