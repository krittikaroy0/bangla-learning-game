<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ছড়া শেখা 🎵</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-light text-dark">

<div class="container mt-5">
    <h2 class="text-center mb-4">ছড়া শেখা 🎵</h2>
    <div id="poemsContainer" class="row justify-content-center"></div>
</div>

<script>
function playAudio(file) {
    new Audio(file).play();
}

fetch('bangla_dataset.json')
  .then(res => res.json())
  .then(data => {
      const container = document.getElementById('poemsContainer');
      data.poems.forEach(poem => {
          const col = document.createElement('div');
          col.className = 'col-md-6 mb-3';
          col.innerHTML = `
              <div class="card p-3 shadow-sm">
                  <h4 class="card-title">${poem.title}</h4>
                  <p style="white-space: pre-line;">${poem.poem_text}</p>
                  <button class="btn btn-primary" onclick="playAudio('${poem.audio}')">🔊 শুনুন</button>
              </div>`;
          container.appendChild(col);
      });
  });
</script>
</body>
</html>
