<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>শব্দ শেখা 🍎</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-light text-dark">

<div class="container mt-5">
    <h2 class="text-center mb-4">শব্দ শেখা 🍎</h2>
    <div id="wordsContainer" class="row justify-content-center"></div>
</div>

<script>
function playAudio(file) {
    new Audio(file).play();
}

fetch('bangla_dataset.json')
  .then(res => res.json())
  .then(data => {
      const container = document.getElementById('wordsContainer');
      data.words.forEach(word => {
          const col = document.createElement('div');
          col.className = 'col-md-3 col-sm-6 mb-3';
          col.innerHTML = `
              <div class="card p-2 shadow-sm">
                  <img src="${word.image}" class="card-img-top" alt="${word.word}">
                  <div class="card-body text-center">
                      <h3>${word.word}</h3>
                      <button class="btn btn-primary mt-2" onclick="playAudio('${word.audio}')">🔊 শুনুন</button>
                  </div>
              </div>`;
          container.appendChild(col);
      });
  });
</script>
</body>
</html>
